<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>
        Mini Shop
    </title>
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <p>
            MISSION 04
        </p>
        <h1>
            Leo Mini Shop
        </h1>
        <p>
            購物車
            <strong id="cart-count">
                0
            </strong>
            件｜總金額 $
            <strong id="cart-total">
                0
            </strong>
        </p>
    </header>
    <main id="products">
        <article class="product">
            <h2>
                筆記本
            </h2>
            <p>
                $80
            </p>
            <button class="add-cart" data-name="筆記本" data-price="80">
                加入購物車
            </button>
        </article>
        <article class="product">
            <h2>
                鉛筆盒
            </h2>
            <p>
                $120
            </p>
            <button class="add-cart" data-name="鉛筆盒" data-price="120">
                加入購物車
            </button>
        </article>
        <article class="product">
            <h2>
                水壺
            </h2>
            <p>
                $250
            </p>
            <button class="add-cart" data-name="水壺" data-price="250">
                加入購物車
            </button>
        </article>
    </main>
    <script src="script.js">
    </script>
</body>

</html>
