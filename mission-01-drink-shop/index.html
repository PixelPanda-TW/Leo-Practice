<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>
        Leo Drink Shop
    </title>
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <p class="eyebrow">
            MISSION 01
        </p>
        <h1>
            Leo Drink Shop
        </h1>
        <p>
            今天想喝什麼？
        </p>
    </header>
    <main>
        <section class="menu" id="menu">
            <article class="drink">
                <h2>
                    珍珠奶茶
                </h2>
                <p>
                    $60
                </p>
                <button class="add" data-name="珍珠奶茶" data-price="60">
                    +
                </button>
            </article>
            <!-- TODO: Leo，請再加入至少兩種飲料 -->
        </section>
        <aside class="summary">
            <h2>
                你的訂單
            </h2>
            <p>
                總杯數：
                <strong id="count">
                    0
                </strong>
            </p>
            <p>
                總金額：$
                <strong id="total">
                    0
                </strong>
            </p>
        </aside>
    </main>
    <script src="script.js">
    </script>
</body>

</html>
